<script>
const W=1080,H=1920,CX=540;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={out3:x=>1-Math.pow(1-x,3),in3:x=>x*x*x,io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  out5:x=>1-Math.pow(1-x,5)};
const lerp=(a,b,x)=>a+(b-a)*x;
const $=id=>document.getElementById(id);
// 중심 좌표(cx,cy) 기준 배치
function put(el,cx,cy,sc=1,op=1,extra=''){
  el.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%) scale('+sc+') '+extra;
  el.style.opacity=op;
}

// ---- 요소 생성 ----
const nameEl=$('name');
[...TEXT.name].forEach(ch=>{const m=document.createElement('span');m.className='m';m.innerHTML='<span>'+ch+'</span>';nameEl.appendChild(m);});
$('en').textContent=TEXT.en;
const hl=TEXT.headline.map(h=>{const d=document.createElement('div');d.className='hl abs';d.innerHTML='<span>'+h+'</span>';$('hls').appendChild(d);return d;});
const pills=TEXT.pills.map(p=>{const d=document.createElement('div');d.className='pill abs';d.textContent=p;$('pills').appendChild(d);return d;});
const rings=[0,1,2].map(()=>{const d=document.createElement('div');d.className='ring abs';d.style.width=d.style.height='520px';$('rings').appendChild(d);return d;});
const dRings=[0,1].map(()=>{const d=document.createElement('div');d.className='rr abs';d.style.width=d.style.height='380px';$('dRings').appendChild(d);return d;});
$('dName').textContent=TEXT.name;$('dTag').textContent=TEXT.tagline;$('dMail').textContent=TEXT.mail;

// 헤드라인·알약 배치 (왼쪽 정렬, 좌측 여백 100px)
const HL_Y=[800,968,1136], HL_X=100;
function pillLayout(){
  // 2 x 2, 왼쪽 정렬
  const rows=[[0,1],[2,3]]; let y=1400;
  rows.forEach(r=>{let x=HL_X; r.forEach(i=>{const w=pills[i].offsetWidth,h=pills[i].offsetHeight;pills[i]._x=x;pills[i]._y=y;pills[i]._w=w;pills[i]._h=h;x+=w+24;}); y+=pills[0].offsetHeight+26;});
}
document.fonts.ready.then(()=>{pillLayout();window.__ready=true;});

function seek(t){
  // ---------- 장면 A: 로고 등장 → 화면 가득 빨강 ----------
  const dIn=E.back(P(t,0.2,1.2));
  const cover=E.io3(P(t,2.3,3.4));
  const dS=(t<2.3? dIn : 1+cover*4.8);
  put($('disc'),CX,820,dS,t>0.2?1:0);
  // 마크: 왼→오 와이프로 그려지고, 이후 이동·축소
  const reveal=E.io3(P(t,1.0,2.3));
  const m1=E.io3(P(t,3.2,4.4)), m2=E.io3(P(t,7.0,8.0));
  let mS=lerp(1,0.62,m1); mS=lerp(mS,0.34,m2);
  let mY=lerp(820,690,m1); mY=lerp(mY,390,m2);
  const mOp=1-E.io3(P(t,11.2,11.8));
  const mk=$('mark');
  put(mk,CX,mY,mS*(0.92+0.08*reveal),mOp);
  mk.style.clipPath='inset(0 '+((1-reveal)*100)+'% 0 0)';
  // 파문(링): 마크 중심에서 퍼져나감
  const rOn=E.out3(P(t,3.4,4.2))*(1-P(t,11.0,11.6));
  rings.forEach((r,k)=>{
    const ph=(((t-3.4)/2.6)+k/3)%1; const s=(0.45+ph*3.4)*(mS/0.62>1?1:mS/0.62);
    put(r,CX,mY,Math.max(.01,s),rOn*(1-ph)*0.28);
  });
  // ---------- 장면 B: 이름 ----------
  const nIn=3.7, nOut=6.6;
  const chars=nameEl.querySelectorAll('.m span');
  chars.forEach((c,i)=>{
    const a=E.out5(P(t,nIn+i*0.09,nIn+i*0.09+0.8)), b=E.in3(P(t,nOut+i*0.06,nOut+i*0.06+0.6));
    c.style.transform='translateY('+((1-a)*115-b*115)+'%)';
  });
  put(nameEl,CX,1040,1,1);
  const enOp=E.out3(P(t,4.5,5.2))*(1-E.in3(P(t,nOut,nOut+0.5)));
  put($('en'),CX,1190+ (1-E.out3(P(t,4.5,5.2)))*24,1,enOp);
  // ---------- 장면 C: 헤드라인 + 서비스 ----------
  hl.forEach((d,i)=>{
    const a=E.out5(P(t,7.7+i*0.18,7.7+i*0.18+0.85)), b=E.in3(P(t,10.9+i*0.08,10.9+i*0.08+0.55));
    d.firstChild.style.transform='translateY('+((1-a)*118-b*118)+'%)';
    d.style.transform='translate('+HL_X+'px,'+(HL_Y[i]-85)+'px)';
    d.style.opacity=(a>0&&b<1)?1:0;
  });
  pills.forEach((p,i)=>{
    const a=E.back(P(t,9.3+i*0.16,9.3+i*0.16+0.7)), b=E.in3(P(t,10.9,11.5));
    const w=p._w||0,h=p._h||0;
    p.style.transform='translate('+(p._x||0)+'px,'+((p._y||0)+(1-a)*60+b*40)+'px) scale('+(0.85+0.15*a)+')';
    p.style.transformOrigin='left center';
    p.style.opacity=clamp(a*1.4)*(1-b);
  });
  // ---------- 흰색 와이프 → 장면 D ----------
  const wp=E.io3(P(t,11.7,12.8));
  put($('wipe'),CX,960,t<11.7?0.001:lerp(0.01,13,wp),t<11.7?0:1);
  const lg=E.back(P(t,12.9,13.7));
  put($('logoFull'),CX,740,Math.max(.001,lg)*(1+0.012*Math.sin(Math.max(0,t-13.7)*2.2)),t>12.9?1:0);
  dRings.forEach((r,k)=>{
    const on=P(t,13.4,13.9); const ph=(((t-13.4)/2.4)+k/2)%1;
