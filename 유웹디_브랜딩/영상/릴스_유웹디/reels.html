  rise(s10l[0],lt,.05); rise(s10l[1],lt,.13); rise(s10l[2],lt,.21);
  const fu=(el,t0)=>{const a=E.out3(P(lt,t0,t0+.3)); op(el.parentNode,a); tf(el,'translateY('+((1-a)*30)+'%)');};
  fu($('s10name').firstChild,.45); fu($('s10b').firstChild,.80);
  const b=E.back(P(lt,.60,.95)); tf($('ctaBubble'),'scale('+lerp(.8,1,clamp(b,0,1.2))+')'); op($('ctaBubble'),clamp(P(lt,.60,.70)));
  ripple(s10r[0],lt,.10,1.0,540,364,128,420,.4); op(s10r[1],0);
}

// ================= 장면 합성 =================
// [id, 시작, 함수, 프리롤]  프리롤: 위로 밀며 들어오는 장면은 전환 중에 내용이 함께 올라오도록 내부 시계를 0.25초 앞당김
const SC=[['s1',0,s1,0],['s2',3.2,s2,0],['s3',6.2,s3,.25],['s4',8.65,s4,.25],['s5',12.2,s5,.25],['s6',14.75,s6,.25],['s7',17.8,s7,0],['s8',20.2,s8,0],['s9',S9A,s9,0],['s10',S9B,s10,0]];
const TR=[{k:'circle',t0:2.90,t1:3.20,cx:506,cy:1348},{k:'up',t0:5.95,t1:6.20},{k:'up',t0:8.40,t1:8.65},{k:'up',t0:11.95,t1:12.20},{k:'up',t0:14.50,t1:14.75},
  {k:'circle',t0:17.50,t1:17.80,cx:502,cy:770},{k:'circle',t0:19.90,t1:20.20,cx:540,cy:500},{k:'left',t0:24.45,t1:24.70},{k:'circle',t0:32.50,t1:32.80,cx:dotX(4),cy:1248}];
const DUR=36.1;
function seek(t){
  SC.forEach(([id,a,fn,pre],i)=>{
    const el=$(id); const tin=i>0?TR[i-1]:null, tout=TR[i]||null;
    const start=tin?tin.t0:0, end=tout?tout.t1:DUR+1;
    if(t<start||t>=end){el.style.display='none';return;}
    el.style.display='block'; el.style.zIndex=i+1; let T='none', clip='none';
    if(tin&&t<tin.t1){ const p=E.io3(P(t,tin.t0,tin.t1));
      if(tin.k==='up') T='translateY('+(H*(1-p))+'px)';
      else if(tin.k==='left') T='translateX('+(W*(1-p))+'px)';
      else { const R=Math.hypot(Math.max(tin.cx,W-tin.cx),Math.max(tin.cy,H-tin.cy)); clip='circle('+(R*p)+'px at '+tin.cx+'px '+tin.cy+'px)'; } }
    if(tout&&t>=tout.t0){ const p=E.io3(P(t,tout.t0,tout.t1));
      if(tout.k==='up') T='translateY('+(-H*p)+'px)';
      else if(tout.k==='left') T='translateX('+(-W*p)+'px)'; }
    el.style.transform=T; el.style.clipPath=clip;
    fn(t-a+pre);
  });
}
window.DUR=DUR;
Promise.all([document.fonts.ready,...[...document.images].map(im=>im.decode().catch(()=>{}))]).then(()=>{seek(0);window.__ready=true;});
